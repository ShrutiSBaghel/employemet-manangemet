spring.application.name=EMS
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# OR microservice integration
or.service.base-url=http://localhost:8081
or.service.internal-api-key=ems-or-internal-key

#FOR AWS Elastic Beanstalk
server.port=${PORT:8080}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

#JWT
jwt_secret_key=${JWT_KEY}